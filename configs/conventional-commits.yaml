# yaml-language-server: $schema=https://raw.githubusercontent.com/release-drafter/release-drafter/master/schema.json

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
include-commits: true
change-template: '- $CHANGE_TITLE ($CHANGE_REFERENCE) $CHANGE_AUTHORS'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG

categories:
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'skip-release'

  - title: '💥 Breaking Changes'
    semver-increment: major
    when:
      labels:
        - 'breaking'
        - 'breaking-change'
        - 'major'

  - title: '🚀 Features & Enhancements'
    semver-increment: minor
    when:
      labels:
        - 'feat'
        - 'feature'
        - 'enhancement'
        - 'minor'

  - title: '🐛 Bug Fixes'
    semver-increment: patch
    when:
      labels:
        - 'fix'
        - 'bug'
        - 'bugfix'
        - 'security'
        - 'patch'

  - title: '⚡ Performance Improvements'
    semver-increment: patch
    when:
      labels:
        - 'perf'
        - 'performance'

  - title: '📚 Documentation'
    semver-increment: patch
    when:
      labels:
        - 'docs'
        - 'documentation'

  - title: '📦 Dependency Updates'
    semver-increment: patch
    when:
      labels:
        - 'dependencies'
        - 'deps'

  - title: '👷 CI/CD'
    semver-increment: patch
    when:
      labels:
        - 'ci'
        - 'build'

  - title: '🧹 Maintenance & Code Quality'
    semver-increment: patch
    when:
      labels:
        - 'refactor'
        - 'chore'
        - 'style'
        - 'test'
        - 'tests'

  - title: '🔄 Reverts'
    semver-increment: patch
    when:
      labels:
        - 'revert'

  - type: 'version-resolver'
    semver-increment: patch

autolabeler:
  # Semver Labels
  - label: 'major'
    title:
      - '/^[a-z]+(\([^\\)]+\))?!:/i'
      - '/^BREAKING( CHANGE)?(:|(\([^\\)]+\))?:)/i'
      - '/BREAKING CHANGE/i'
    branch:
      - '/.*breaking.*/i'
    body:
      - '/BREAKING[ -]CHANGE:/i'

  - label: 'minor'
    title:
      - '/^feat(ure)?(\([^\\)]+\))?:/i'
    branch:
      - '/^feat(\/|-)/i'
      - '/^feature(\/|-)/i'

  - label: 'patch'
    title:
      - '/^(fix|bugfix|hotfix)(\([^\\)]+\))?:/i'
      - '/^sec(urity)?(\([^\\)]+\))?:/i'
      - '/^perf(ormance)?(\([^\\)]+\))?:/i'
      - '/^docs?(\([^\\)]+\))?:/i'
      - '/^refactor(\([^\\)]+\))?:/i'
      - '/^(deps?|dependencies)(\([^\\)]+\))?:/i'
      - '/^chore\(deps(-[a-z0-9]+)?\):/i'
      - '/^(ci|build)(\([^\\)]+\))?:/i'
      - '/^chore(\([^\\)]+\))?:/i'
      - '/^tests?(\([^\\)]+\))?:/i'
      - '/^revert(\([^\\)]+\))?:/i'
    branch:
      - '/^fix(\/|-)/i'
      - '/^bugfix(\/|-)/i'
      - '/^hotfix(\/|-)/i'
      - '/^sec(urity)?(\/|-)/i'
      - '/^perf(\/|-)/i'
      - '/^docs?(\/|-)/i'
      - '/^refactor(\/|-)/i'
      - '/^dependabot\//i'
      - '/^renovate\//i'
      - '/^deps?(\/|-)/i'
      - '/^ci(\/|-)/i'
      - '/^build(\/|-)/i'
      - '/^chore(\/|-)/i'
      - '/^tests?(\/|-)/i'
      - '/^revert(\/|-)/i'

  # Breaking Changes
  - label: 'breaking'
    title:
      - '/^[a-z]+(\([^\\)]+\))?!:/i'
      - '/^BREAKING( CHANGE)?(:|(\([^\\)]+\))?:)/i'
      - '/BREAKING CHANGE/i'
    branch:
      - '/.*breaking.*/i'
    body:
      - '/BREAKING[ -]CHANGE:/i'

  # Features
  - label: 'feat'
    title:
      - '/^feat(ure)?(\([^\\)]+\))?:/i'
    branch:
      - '/^feat(\/|-)/i'
      - '/^feature(\/|-)/i'

  # Fixes
  - label: 'fix'
    title:
      - '/^(fix|bugfix|hotfix)(\([^\\)]+\))?:/i'
    branch:
      - '/^fix(\/|-)/i'
      - '/^bugfix(\/|-)/i'
      - '/^hotfix(\/|-)/i'

  # Performance
  - label: 'perf'
    title:
      - '/^perf(ormance)?(\([^\\)]+\))?:/i'
    branch:
      - '/^perf(\/|-)/i'

  # Documentation
  - label: 'docs'
    title:
      - '/^docs?(\([^\\)]+\))?:/i'
    branch:
      - '/^docs?(\/|-)/i'

  # Refactoring
  - label: 'refactor'
    title:
      - '/^refactor(\([^\\)]+\))?:/i'
    branch:
      - '/^refactor(\/|-)/i'

  # Tests
  - label: 'test'
    title:
      - '/^tests?(\([^\\)]+\))?:/i'
    branch:
      - '/^tests?(\/|-)/i'

  # Dependencies
  - label: 'dependencies'
    title:
      - '/^(deps?|dependencies)(\([^\\)]+\))?:/i'
      - '/^chore\(deps(-[a-z0-9]+)?\):/i'
    branch:
      - '/^dependabot\//i'
      - '/^renovate\//i'
      - '/^deps?(\/|-)/i'

  # Build
  - label: 'build'
    title:
      - '/^build(\([^\\)]+\))?:/i'
    branch:
      - '/^build(\/|-)/i'

  # CI
  - label: 'ci'
    title:
      - '/^(ci|build)(\([^\\)]+\))?:/i'
    branch:
      - '/^ci(\/|-)/i'

  # Chores & Maintenance
  - label: 'chore'
    title:
      - '/^chore(\([^\\)]+\))?:/i'
    branch:
      - '/^chore(\/|-)/i'

  # Code Style
  - label: 'style'
    title:
      - '/^style(\([^\\)]+\))?:/i'
    branch:
      - '/^style(\/|-)/i'

  # Reverts
  - label: 'revert'
    title:
      - '/^revert(\([^\\)]+\))?:/i'
    branch:
      - '/^revert(\/|-)/i'
