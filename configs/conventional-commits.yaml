name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
include-commits: true
change-template: '- $CHANGE_TITLE ($CHANGE_REFERENCE) $CHANGE_AUTHORS'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: $PREVIOUS_TAG...$NEXT_TAG

categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
      - 'breaking-change'
      - 'boom'
      - '💥'
      - ':boom:'
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
      - 'sparkles'
      - '✨'
      - ':sparkles:'
      - '🎉'
      - ':tada:'
      - '🚀'
      - ':rocket:'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'security'
      - '🐛'
      - ':bug:'
      - '🚑'
      - ':ambulance:'
      - '🔒'
      - ':lock:'
  - title: '⚡ Performance Improvements'
    labels:
      - 'perf'
      - 'performance'
      - 'zap'
      - '⚡'
      - ':zap:'
  - title: '📚 Documentation'
    labels:
      - 'docs'
      - 'documentation'
      - 'memo'
      - '📝'
      - ':memo:'
      - '📚'
      - ':books:'
  - title: '📦 Dependency Updates'
    labels:
      - 'dependencies'
      - 'deps'
      - 'package'
      - '📦'
      - ':package:'
      - '⬆️'
      - ':arrow_up:'
  - title: '🧰 Maintenance & Code Quality'
    labels:
      - 'refactor'
      - 'chore'
      - 'style'
      - 'build'
      - 'ci'
      - 'test'
      - 'tests'
      - 'recycle'
      - '♻️'
      - ':recycle:'
      - '🔧'
      - ':wrench:'
      - '🔨'
      - ':hammer:'
      - '✅'
      - ':white_check_mark:'
  - title: '🔄 Reverts'
    labels:
      - 'revert'
      - 'rewind'
      - '⏪'
      - ':rewind:'

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'breaking-change'
      - 'boom'
      - '💥'
      - ':boom:'
  minor:
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
      - 'sparkles'
      - '✨'
      - ':sparkles:'
      - '🎉'
      - ':tada:'
      - '🚀'
      - ':rocket:'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'security'
      - '🐛'
      - ':bug:'
      - '🚑'
      - ':ambulance:'
      - '🔒'
      - ':lock:'
      - 'perf'
      - 'performance'
      - 'zap'
      - '⚡'
      - ':zap:'
      - 'refactor'
      - 'recycle'
      - '♻️'
      - ':recycle:'
      - 'dependencies'
      - 'deps'
      - 'package'
      - '📦'
      - ':package:'
      - '⬆️'
      - ':arrow_up:'
      - 'chore'
      - '🔧'
      - ':wrench:'
      - '🔨'
      - ':hammer:'
      - 'docs'
      - 'documentation'
      - 'memo'
      - '📝'
      - ':memo:'
      - '📚'
      - ':books:'
      - 'ci'
      - 'build'
      - 'test'
      - 'tests'
      - '✅'
      - ':white_check_mark:'
      - 'style'
      - 'revert'
      - 'rewind'
      - '⏪'
      - ':rewind:'
  default: patch

autolabeler:
  # Breaking Changes
  - label: 'breaking'
    title:
      - '/^(:boom:|💥)/'
      - '/^[a-z]+(\([^\)]+\))?!:/i'
      - '/^BREAKING( CHANGE)?(:|(\([^\)]+\))?:)/i'
      - '/BREAKING CHANGE/i'
    branch:
      - '/.*breaking.*/i'
    body:
      - '/BREAKING[ -]CHANGE:/i'

  # Features
  - label: 'feat'
    title:
      - '/^((:sparkles:|✨|:tada:|🎉|:rocket:|🚀)\s*)?feat(ure)?(\([^\)]+\))?:/i'
    branch:
      - '/^feat(\/|-)/i'
      - '/^feature(\/|-)/i'

  # Fixes
  - label: 'fix'
    title:
      - '/^((:bug:|🐛|:ambulance:|🚑️|🚑|:adhesive_bandage:|🩹)\s*)?(fix|bugfix|hotfix)(\([^\)]+\))?:/i'
    branch:
      - '/^fix(\/|-)/i'
      - '/^bugfix(\/|-)/i'
      - '/^hotfix(\/|-)/i'

  # Performance
  - label: 'perf'
    title:
      - '/^((:zap:|⚡️|⚡)\s*)?perf(ormance)?(\([^\)]+\))?:/i'
    branch:
      - '/^perf(\/|-)/i'

  # Documentation
  - label: 'docs'
    title:
      - '/^((:memo:|📝|:books:|📚|:bulb:|💡)\s*)?docs?(\([^\)]+\))?:/i'
    branch:
      - '/^docs?(\/|-)/i'

  # Refactoring
  - label: 'refactor'
    title:
      - '/^((:recycle:|♻️|♻|:art:|🎨|:fire:|🔥)\s*)?refactor(\([^\)]+\))?:/i'
    branch:
      - '/^refactor(\/|-)/i'

  # Tests
  - label: 'test'
    title:
      - '/^((:white_check_mark:|✅|:test_tube:|🧪)\s*)?tests?(\([^\)]+\))?:/i'
    branch:
      - '/^tests?(\/|-)/i'

  # Dependencies
  - label: 'dependencies'
    title:
      - '/^((:arrow_up:|⬆️|⬆|:arrow_down:|⬇️|⬇|:package:|📦️|📦|:pushpin:|📌)\s*)?(deps?|dependencies)(\([^\)]+\))?:/i'
      - '/^chore\(deps(-[a-z0-9]+)?\):/i'
    branch:
      - '/^dependabot\//i'
      - '/^renovate\//i'
      - '/^deps?(\/|-)/i'

  # Build
  - label: 'build'
    title:
      - '/^((:construction_worker:|👷|:package:|📦)\s*)?build(\([^\)]+\))?:/i'
    branch:
      - '/^build(\/|-)/i'

  # CI
  - label: 'ci'
    title:
      - '/^((:green_heart:|💚|:construction_worker:|👷)\s*)?ci(\([^\)]+\))?:/i'
    branch:
      - '/^ci(\/|-)/i'

  # Chores & Maintenance
  - label: 'chore'
    title:
      - '/^((:wrench:|🔧|:hammer:|🔨|:truck:|🚚|:wastebasket:|🗑️|🗑)\s*)?chore(\([^\)]+\))?:/i'
    branch:
      - '/^chore(\/|-)/i'

  # Code Style
  - label: 'style'
    title:
      - '/^((:lipstick:|💄|:art:|🎨)\s*)?style(\([^\)]+\))?:/i'
    branch:
      - '/^style(\/|-)/i'

  # Reverts
  - label: 'revert'
    title:
      - '/^((:rewind:|⏪️|⏪)\s*)?revert(\([^\)]+\))?:/i'
    branch:
      - '/^revert(\/|-)/i'
