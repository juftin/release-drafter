      - '/^(:triangular_flag_on_post:|🚩)/'
      - '/^(:necktie:|👔)/'
      - '/^(:t-rex:|🦖)/'
      - '/^(:airplane:|✈️?)/'
      - '/^feat(ure)?(\([^\)]+\))?:/i'
    branch:
      - '/^feat(\//|-)/i'
      - '/^feature(\//|-)/i'

  # Semver: Patch
