autolabeler:
  # Semver: Major
  - label: 'major'
    title:
      - '/^(:boom:|💥)/'
      - '/^([a-z]+(\([^\)]+\))?!:|.*BREAKING CHANGE:?)/i'
      - '/BREAKING[ -]CHANGE/i'
    branch:
      - '/.*breaking.*/i'
    body:
      - '/BREAKING[ -]CHANGE:/i'

  # Semver: Minor
  - label: 'minor'
    title:
      - '/^(:sparkles:|✨)/'
      - '/^(:tada:|🎉)/'
      - '/^(:rocket:|🚀)/'
      - '/^(:children_crossing:|🚸)/'
      - '/^(:iphone:|📱)/'
      - '/^(:dizzy:|💫)/'
      - '/^(:globe_with_meridians:|🌐)/'
