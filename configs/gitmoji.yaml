      - '🏷️'
      - '🏷'
      - '🗃️'
      - '🗃'
      - '💄'
      - '💩'
  - title: '📦 Dependency Updates'
    labels:
      - '⬆️'
      - '⬆'
      - '⬇️'
      - '⬇'
      - '📌'
      - '➕'
      - '➖'
      - '📦️'
      - '📦'
  - title: '👷 CI/CD'
    labels:
      - '👷'
      - '💚'
      - '🔧'
      - '🔨'
      - '🧱'
      - '🧑‍💻'
      - '🙈'
      - '📈'
      - '🩺'
      - '💸'
      - '🔖'
      - '🚧'
      - '🔊'
      - '🔇'
